<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}PharmaSim{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet"></head><body>
<nav class="navbar navbar-expand-sm navbar-dark"><div class="container">
<a class="navbar-brand" href="{{ url_for('main.index') }}">Pharma<span>Sim</span></a>
<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nv" aria-label="Menu"><span class="navbar-toggler-icon"></span></button>
<div id="nv" class="collapse navbar-collapse"><div class="navbar-nav">
<a class="nav-link" href="{{ url_for('main.scenario_list', module='clinical') }}">Clinical</a>
<a class="nav-link" href="{{ url_for('main.scenario_list', module='qc') }}">QC Lab</a>
<a class="nav-link" href="{{ url_for('main.progress') }}">Progress</a>
<a class="nav-link" href="{{ url_for('main.about') }}">About</a></div></div></div></nav>
<main class="container py-4">{% block content %}{% endblock %}</main>
<footer class="container pb-4"><div class="disclaimer"></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
